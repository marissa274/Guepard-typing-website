services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guepard
      POSTGRES_USER: guepard
      POSTGRES_PASSWORD: ${GUEPARD_DB_PASSWORD:-guepard_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - guepard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guepard -d guepard"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  guepard_postgres:
