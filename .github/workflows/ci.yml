name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guepard
          POSTGRES_USER: guepard
          POSTGRES_PASSWORD: guepard_ci_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U guepard -d guepard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://guepard:guepard_ci_only@127.0.0.1:5433/guepard
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --silent
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
